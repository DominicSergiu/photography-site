<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dominic Lucaciu — Photography</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff;
    --ink:#161616;
    --muted:#8f8f8f;
    --radius:8px;
    --pad:12px;
    --gap:8px;
    --ease:cubic-bezier(0.4,0,0.2,1);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',-apple-system,sans-serif;
    font-size:16px;
    line-height:24px;
    letter-spacing:0.7px;
    font-weight:400;
    -webkit-font-smoothing:antialiased;
    display:flex;
    flex-direction:column;
    min-height:100%;
  }
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;font-size:16px;letter-spacing:0.7px;}
  img{display:block;}

  header{
    display:flex;justify-content:space-between;align-items:center;
    padding:var(--pad) var(--pad) 20px;
    flex:none;
    position:relative;
  }
  .brand{display:flex;align-items:center;gap:8px;min-width:0;}
  .logo{font-weight:500;}
  .brand .back{display:flex;align-items:center;color:var(--ink);cursor:pointer;flex:none;background:#f2f2f2;border-radius:8px;padding:6px;transition:background .18s var(--ease);}
  .brand .back:hover{background:#e6e6e6;}
  .brand .back svg{width:17px;height:17px;}
  nav{display:flex;gap:20px;position:relative;}
  nav a{color:var(--muted);cursor:pointer;transition:color .18s var(--ease);}
  nav a:hover, nav a.active{color:var(--ink);}
  .nav-toggle{display:none;background:none;border:none;color:var(--ink);cursor:pointer;}

  .nav-work{position:static;}
  .work-menu{
    position:absolute;top:100%;right:0;
    max-width:calc(100vw - var(--pad) * 2);
    display:flex;gap:36px;
    background:var(--bg);
    padding:26px;
    border:1px solid #ececec;border-radius:var(--radius);
    box-shadow:0 8px 24px rgba(0,0,0,0.06);
    opacity:0;visibility:hidden;
    transition:opacity .2s var(--ease), visibility 0s linear .2s;
    z-index:20;
  }
  .nav-work:not(.dismissed):hover .work-menu,
  .nav-work:not(.dismissed):focus-within .work-menu{
    opacity:1;visibility:visible;transition:opacity .2s var(--ease), visibility 0s;
  }
  .work-project{display:flex;flex-direction:column;gap:12px;}
  .work-project .wp-title{color:var(--muted);white-space:nowrap;transition:color .18s var(--ease);}
  .work-project:hover .wp-title{color:var(--ink);}
  .wp-carousel{position:relative;width:180px;}
  .wp-viewport{overflow:hidden;width:180px;}
  .wp-track{display:flex;gap:6px;transition:transform .26s var(--ease);}
  .wp-thumb{flex:none;display:block;}
  .wp-thumb img{width:56px;height:56px;object-fit:cover;border-radius:6px;display:block;background:#f2f2f2;transition:opacity .18s var(--ease);}
  .wp-thumb:hover img{opacity:0.85;}
  .wp-arrow{
    position:absolute;top:50%;transform:translateY(-50%);
    width:22px;height:22px;padding:0;
    border:none;border-radius:6px;
    background:rgba(255,255,255,0.92);color:var(--ink);
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    box-shadow:0 1px 5px rgba(0,0,0,0.16);
    opacity:0;transition:opacity .18s var(--ease);z-index:2;
  }
  .wp-arrow svg{width:15px;height:15px;}
  .wp-prev{left:-9px;}
  .wp-next{right:-9px;}
  .wp-carousel:hover .wp-arrow{opacity:1;}
  .wp-carousel:hover .wp-arrow.disabled,
  .wp-arrow.disabled{opacity:0;pointer-events:none;}

  main{flex:1 0 auto;}

  .view{opacity:0;transition:opacity .22s var(--ease);}
  .view.in{opacity:1;}

  .grid{
    column-count:3;
    column-gap:var(--gap);
    padding:0 var(--pad) 64px;
  }
  .grid figure{
    break-inside:avoid;
    position:relative;
    margin:0 0 var(--gap);
    overflow:hidden;
    border-radius:var(--radius);
    background:#f2f2f2;
    cursor:pointer;
  }
  .grid img{width:100%;height:auto;display:block;opacity:0;transition:opacity .3s var(--ease);}
  .grid img.loaded{opacity:1;}
  .grid figure:hover img.loaded{opacity:0.88;}
  .grid .chip{
    position:absolute;left:10px;bottom:10px;
    background:#fff;color:var(--ink);
    font-size:14px;line-height:20px;padding:5px 9px;border-radius:8px;
    opacity:0;transition:opacity .18s var(--ease);
  }
  .grid figure:hover .chip{opacity:1;}

  .about{padding:4vh var(--pad) 12vh;max-width:560px;}
  .about p+p{margin-top:20px;}
  .about .links{display:flex;gap:24px;margin-top:36px;color:var(--muted);}
  .about .links a{transition:color .18s var(--ease);}
  .about .links a:hover{color:var(--ink);}

  .status{padding:4vh var(--pad);color:var(--muted);}

  footer{
    flex:none;
    padding:24px var(--pad) 28px;
    display:flex;justify-content:space-between;flex-wrap:wrap;gap:16px;
    color:var(--muted);
  }
  footer a{transition:color .18s var(--ease);}
  footer a:hover{color:var(--ink);}
  footer .cols{display:flex;gap:28px;flex-wrap:wrap;}

  .lightbox{
    position:fixed;inset:0;background:var(--bg);z-index:200;
    display:flex;flex-direction:column;
    opacity:0;visibility:hidden;
    transition:opacity .22s var(--ease), visibility 0s linear .22s;
  }
  .lightbox.open{opacity:1;visibility:visible;transition:opacity .22s var(--ease), visibility 0s;}
  .lightbox-bar{display:flex;justify-content:space-between;align-items:center;padding:var(--pad);flex:none;}
  .lightbox-bar .cap{color:var(--muted);}
  .lightbox-bar .cap .lb-project{color:var(--ink);cursor:pointer;transition:opacity .18s var(--ease);}
  .lightbox-bar .cap .lb-project:hover{opacity:0.55;}
  .lightbox-bar .close{background:none;border:none;cursor:pointer;color:var(--ink);}
  .lightbox-main{flex:1;min-height:0;display:flex;align-items:center;gap:4px;padding:0 var(--pad);}
  .lightbox-main .navbtn{
    flex:none;background:#f2f2f2;border:none;border-radius:8px;cursor:pointer;color:var(--ink);padding:6px;
    display:flex;align-items:center;justify-content:center;
    transition:background .18s var(--ease);
  }
  .lightbox-main .navbtn:hover{background:#e6e6e6;}
  .lightbox-main .navbtn svg{width:18px;height:18px;}
  .stage{flex:1;min-width:0;height:100%;position:relative;}
  .stage img{
    position:absolute;inset:0;margin:auto;
    max-width:100%;max-height:100%;width:auto;height:auto;
    object-fit:contain;border-radius:var(--radius);
    opacity:0;transition:opacity .3s var(--ease);
  }
  .stage img.visible{opacity:1;}
  .filmstrip{display:flex;justify-content:safe center;gap:var(--gap);overflow-x:auto;padding:12px var(--pad) 16px;flex:none;}
  .filmstrip img{
    width:56px;height:56px;object-fit:cover;border-radius:6px;
    cursor:pointer;flex:none;opacity:0.35;transition:opacity .18s var(--ease);
  }
  .filmstrip img.current{opacity:1;}
  .filmstrip img:hover{opacity:0.7;}

  @media(prefers-reduced-motion:reduce){
    *{transition:none !important;}
    .view{opacity:1;}
  }
  @media(max-width:900px){ .grid{column-count:2;} }
  @media(max-width:600px){
    .grid{column-count:1;}
    nav{display:none;position:absolute;top:100%;left:0;right:0;background:var(--bg);flex-direction:column;gap:0;border-bottom:1px solid #ececec;z-index:10;}
    nav.open{display:flex;}
    nav a{padding:14px var(--pad);width:100%;}
    .nav-work{width:100%;}
    .work-menu{
      position:static;opacity:1;visibility:visible;transition:none;
      flex-direction:column;gap:22px;
      border:none;box-shadow:none;border-radius:0;
      padding:4px var(--pad) 16px;
    }
    .work-project{flex-direction:column;align-items:stretch;gap:10px;}
    .wp-carousel{width:auto;}
    .wp-viewport{width:auto;overflow-x:auto;}
    .wp-track{transform:none !important;}
    .wp-arrow{display:none;}
    .wp-thumb img{width:52px;height:52px;}
    .nav-toggle{display:block;}
    .lightbox-main{flex-direction:column;}
    .lightbox-main .navbtn{display:none;}
  }
</style>
</head>
<body>

<header>
  <div class="brand" id="brand"><a href="#/" class="logo">Dominic Lucaciu</a></div>
  <nav id="nav"></nav>
  <button class="nav-toggle" id="navToggle">Menu</button>
</header>

<main id="app"><div class="status">Loading</div></main>

<footer>
  <a href="#/">Dominic Lucaciu</a>
  <div class="cols">
    <a href="mailto:lucaciu.dominic@gmail.com">lucaciu.dominic@gmail.com</a>
    <a href="https://www.instagram.com/dominic_lucaciu/" target="_blank" rel="noopener">Instagram</a>
  </div>
</footer>

<div class="lightbox" id="lightbox">
  <div class="lightbox-bar">
    <span class="cap" id="lbCap"></span>
    <button class="close" id="lbClose">Close</button>
  </div>
  <div class="lightbox-main">
    <button class="navbtn" id="lbPrev" aria-label="Previous photo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div class="stage" id="stage">
      <img id="lbA" src="" alt="">
      <img id="lbB" src="" alt="">
    </div>
    <button class="navbtn" id="lbNext" aria-label="Next photo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
    </button>
  </div>
  <div class="filmstrip" id="filmstrip"></div>
</div>

<script>
const ABOUT = [
  "Dominic Lucaciu is a photographer based in London, working across street and portrait photography.",
  "By day, a product designer. Off the clock, the same instincts go into a viewfinder instead of a screen: noticing structure, waiting for the moment a frame resolves itself, then getting out of the way."
];

let FOLDERS = {};
let ORDER = [];

const app = document.getElementById('app');
const navEl = document.getElementById('nav');
const brandEl = document.getElementById('brand');
const navToggle = document.getElementById('navToggle');
navToggle.addEventListener('click', () => navEl.classList.toggle('open'));

const CHEVRON_LEFT = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>`;
const CHEVRON_RIGHT = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>`;

async function loadContent(){
  const manifest = await fetch('content/series.json', { cache:'no-cache' }).then(r => r.json());
  const series = await Promise.all(
    manifest.map(name =>
      fetch(`content/series/${name}.json`, { cache:'no-cache' })
        .then(r => r.ok ? r.json() : null)
        .catch(() => null)
    )
  );
  const valid = series.filter(s => s && Array.isArray(s.photos) && s.photos.length);
  valid.sort((a,b) => (a.order ?? 99) - (b.order ?? 99));

  FOLDERS = {};
  ORDER = [];
  valid.forEach(s => {
    const key = s.slug;
    FOLDERS[key] = {
      title: s.title,
      photos: s.photos.map(p => ({ src: p.image, cap: p.caption || '', featured: !!p.featured }))
    };
    ORDER.push(key);
  });
}

function buildNav(){
  const projects = ORDER.map(key => {
    const thumbs = FOLDERS[key].photos
      .map(p => `<a class="wp-thumb" href="#/project/${key}" tabindex="-1"><img src="${p.src}" alt="" loading="lazy"></a>`)
      .join('');
    return `<div class="work-project">
        <a class="wp-title" href="#/project/${key}">${FOLDERS[key].title}</a>
        <div class="wp-carousel">
          <button class="wp-arrow wp-prev" aria-label="Previous previews" tabindex="-1">${CHEVRON_LEFT}</button>
          <div class="wp-viewport"><div class="wp-track">${thumbs}</div></div>
          <button class="wp-arrow wp-next" aria-label="More previews" tabindex="-1">${CHEVRON_RIGHT}</button>
        </div>
      </div>`;
  }).join('');
  navEl.innerHTML = `
    <div class="nav-work">
      <a href="#/" class="work-trigger">Work</a>
      <div class="work-menu">${projects}</div>
    </div>
    <a href="#/about">About</a>`;

  const navWork = navEl.querySelector('.nav-work');
  navWork.addEventListener('click', e => {
    if(e.target.closest('a[href^="#/project/"]')) navWork.classList.add('dismissed');
  });
  navWork.addEventListener('mouseleave', () => navWork.classList.remove('dismissed'));
  setupCarousels();
}

function setupCarousels(){
  const VISIBLE = 3, STEP = 62; // 56px thumb + 6px gap
  navEl.querySelectorAll('.wp-carousel').forEach(car => {
    const track = car.querySelector('.wp-track');
    const prev = car.querySelector('.wp-prev');
    const next = car.querySelector('.wp-next');
    const maxIndex = Math.max(0, track.children.length - VISIBLE);
    let index = 0;
    const update = () => {
      track.style.transform = `translateX(${-index * STEP}px)`;
      prev.classList.toggle('disabled', index <= 0);
      next.classList.toggle('disabled', index >= maxIndex);
    };
    prev.addEventListener('click', e => { e.preventDefault(); index = Math.max(0, index - 1); update(); });
    next.addEventListener('click', e => { e.preventDefault(); index = Math.min(maxIndex, index + 1); update(); });
    update();
  });
}

function featuredPhotos(){
  const buckets = ORDER.map(key =>
    FOLDERS[key].photos
      .map((p, i) => ({ key, i, p }))
      .filter(x => x.p.featured)
  );
  const out = [];
  let round = 0, added = true;
  while(added){
    added = false;
    buckets.forEach(b => {
      if(b[round]){ out.push(b[round]); added = true; }
    });
    round++;
  }
  if(out.length) return out;
  return ORDER.flatMap(key => FOLDERS[key].photos.map((p, i) => ({ key, i, p })));
}

function esc(s){
  return (s || '').replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
}

// A lightbox sequence is an ordered list of { src, cap, key, title } —
// key/title identify the project each photo belongs to.
function homeSequence(){
  return featuredPhotos().map(({ key, p }) => ({ src: p.src, cap: p.cap, key, title: FOLDERS[key].title }));
}
function projectSequence(key){
  return FOLDERS[key].photos.map(p => ({ src: p.src, cap: p.cap, key, title: FOLDERS[key].title }));
}

function homeView(){
  const items = featuredPhotos();
  return `
    <div class="grid">
      ${items.map(({key, p}, pos) => `
        <figure data-list="home" data-index="${pos}">
          <img src="${p.src}" alt="${esc(p.cap)}" loading="lazy">
          <span class="chip">${esc(FOLDERS[key].title)}</span>
        </figure>`).join('')}
    </div>`;
}

function folderView(key){
  const f = FOLDERS[key];
  if(!f){ return `<div class="status">Series not found</div>`; }
  return `
    <div class="grid">
      ${f.photos.map((p, i) => `
        <figure data-list="project" data-key="${key}" data-index="${i}">
          <img src="${p.src}" alt="${esc(p.cap)}" loading="lazy">
          ${p.cap ? `<span class="chip">${esc(p.cap)}</span>` : ''}
        </figure>`).join('')}
    </div>`;
}

function aboutView(){
  return `
    <div class="about">
      ${ABOUT.map(p => `<p>${p}</p>`).join('')}
      <div class="links">
        <a href="mailto:lucaciu.dominic@gmail.com">lucaciu.dominic@gmail.com</a>
        <a href="https://www.instagram.com/dominic_lucaciu/" target="_blank" rel="noopener">Instagram</a>
      </div>
    </div>`;
}

function attachGridHandlers(){
  document.querySelectorAll('.grid figure').forEach(fig => {
    fig.addEventListener('click', () => {
      const index = parseInt(fig.dataset.index, 10);
      const list = fig.dataset.list === 'home' ? homeSequence() : projectSequence(fig.dataset.key);
      openLightbox(list, index);
    });
  });
}

function attachImageFades(){
  document.querySelectorAll('.grid img').forEach(img => {
    if(img.complete){ img.classList.add('loaded'); return; }
    const reveal = () => img.classList.add('loaded');
    img.addEventListener('load', reveal, { once:true });
    img.addEventListener('error', reveal, { once:true });
  });
}

let firstRender = true;
function render(){
  const hash = location.hash || '#/';
  const projectMatch = hash.match(/^#\/project\/([a-z0-9-]+)/);
  document.querySelectorAll('nav a').forEach(a => a.classList.remove('active'));

  if(projectMatch && FOLDERS[projectMatch[1]]){
    brandEl.innerHTML = `<a href="#/" class="back" aria-label="Back to home">${CHEVRON_LEFT}</a><span class="logo">${FOLDERS[projectMatch[1]].title}</span>`;
  } else {
    brandEl.innerHTML = `<a href="#/" class="logo">Dominic Lucaciu</a>`;
  }

  let html;
  if(projectMatch){
    const key = projectMatch[1];
    html = folderView(key);
    const trigger = document.querySelector('.work-trigger');
    if(trigger) trigger.classList.add('active');
  } else if(hash === '#/about'){
    html = aboutView();
    const link = document.querySelector(`nav a[href="#/about"]`);
    if(link) link.classList.add('active');
  } else {
    html = homeView();
  }

  const paint = () => {
    app.innerHTML = `<div class="view">${html}</div>`;
    attachGridHandlers();
    attachImageFades();
    window.scrollTo(0,0);
    requestAnimationFrame(() => {
      const v = app.querySelector('.view');
      if(v) v.classList.add('in');
    });
  };

  const existing = app.querySelector('.view');
  if(existing && !firstRender){
    existing.classList.remove('in');
    setTimeout(paint, 160);
  } else {
    paint();
  }
  firstRender = false;
  navEl.classList.remove('open');
}

/* ---- Lightbox ---- */
const lb = document.getElementById('lightbox');
const layers = [document.getElementById('lbA'), document.getElementById('lbB')];
const lbCap = document.getElementById('lbCap');
const filmstrip = document.getElementById('filmstrip');
let activeLayer = 0, lbList = [], currentIndex = 0, token = 0;

function preload(src){
  return new Promise(resolve => {
    const img = new Image();
    img.onload = img.onerror = () => resolve();
    img.src = src;
  });
}

async function showPhoto(index, immediate){
  const p = lbList[index];
  const myToken = ++token;
  await preload(p.src);
  if(myToken !== token) return;

  const incoming = layers[1 - activeLayer];
  const outgoing = layers[activeLayer];
  incoming.src = p.src;
  incoming.alt = p.cap;

  const swap = () => { incoming.classList.add('visible'); outgoing.classList.remove('visible'); };
  immediate ? swap() : requestAnimationFrame(swap);

  activeLayer = 1 - activeLayer;
  currentIndex = index;
  lbCap.innerHTML = `<a class="lb-project" href="#/project/${p.key}">${esc(p.title)}</a>${p.cap ? ` — ${esc(p.cap)}` : ''}`;
  filmstrip.querySelectorAll('img').forEach((img, i) => img.classList.toggle('current', i === index));

  const n = lbList.length;
  preload(lbList[(index + 1) % n].src);
  preload(lbList[(index - 1 + n) % n].src);
}

function openLightbox(list, index){
  lbList = list;
  renderFilmstrip(index);
  layers.forEach(l => { l.classList.remove('visible'); l.src = ''; });
  activeLayer = 0;
  showPhoto(index, true);
  lb.classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeLightbox(){
  lb.classList.remove('open');
  document.body.style.overflow = '';
}
function renderFilmstrip(index){
  filmstrip.innerHTML = lbList.map((p, i) => `<img src="${p.src}" alt="${esc(p.cap)}" data-index="${i}" class="${i===index?'current':''}">`).join('');
  filmstrip.querySelectorAll('img').forEach(thumb => {
    thumb.addEventListener('click', () => showPhoto(parseInt(thumb.dataset.index, 10)));
  });
}
function nextPhoto(){ showPhoto((currentIndex + 1) % lbList.length); }
function prevPhoto(){ const n = lbList.length; showPhoto((currentIndex - 1 + n) % n); }

// A project link inside the caption closes the lightbox; its href handles navigation.
lbCap.addEventListener('click', e => { if(e.target.closest('.lb-project')) closeLightbox(); });
document.getElementById('lbClose').addEventListener('click', closeLightbox);
document.getElementById('lbNext').addEventListener('click', nextPhoto);
document.getElementById('lbPrev').addEventListener('click', prevPhoto);
document.addEventListener('keydown', e => {
  if(!lb.classList.contains('open')) return;
  if(e.key === 'Escape') closeLightbox();
  if(e.key === 'ArrowRight') nextPhoto();
  if(e.key === 'ArrowLeft') prevPhoto();
});

/* ---- boot ---- */
loadContent()
  .then(() => {
    buildNav();
    window.addEventListener('hashchange', render);
    render();
  })
  .catch(() => {
    app.innerHTML = `<div class="status">Couldn't load the photo series. If you're opening this file directly, run a local server instead: <code>npx serve</code></div>`;
  });
</script>

</body>
</html>
