<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dominic Lucaciu — Photography</title>
<meta name="description" content="Dominic Lucaciu is a photographer based in London, working in street photography.">

<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">

<meta property="og:type" content="website">
<meta property="og:url" content="https://dominiclucaciu.com/">
<meta property="og:title" content="Dominic Lucaciu — Photography">
<meta property="og:description" content="Dominic Lucaciu is a photographer based in London, working in street photography.">
<meta property="og:image" content="https://dominiclucaciu.com/images/Dominic%20Lucaciu-41.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Dominic Lucaciu — Photography">
<meta name="twitter:description" content="Dominic Lucaciu is a photographer based in London, working in street photography.">
<meta name="twitter:image" content="https://dominiclucaciu.com/images/Dominic%20Lucaciu-41.jpg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff;
    --ink:#161616;
    --muted:#8f8f8f;
    --radius:8px;
    --pad:12px;
    --gap:8px;
    --ease:cubic-bezier(0.4,0,0.2,1);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  /* Only html is pinned to the window height; body must be free to grow with the
     page, or the sticky tabs (whose containing block is body) scroll away after one screen. */
  html{height:100%;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',-apple-system,sans-serif;
    font-size:16px;
    line-height:24px;
    letter-spacing:0.7px;
    font-weight:400;
    -webkit-font-smoothing:antialiased;
    display:flex;
    flex-direction:column;
    min-height:100%;
  }
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;font-size:16px;letter-spacing:0.7px;}
  img{display:block;}

  header{
    display:flex;justify-content:space-between;align-items:center;
    padding:var(--pad) var(--pad) 20px;
    flex:none;
    position:relative;
  }
  .brand{display:flex;align-items:center;gap:8px;min-width:0;}
  .logo{font-weight:500;}
  nav{display:flex;gap:20px;position:relative;}
  nav a{color:var(--muted);cursor:pointer;transition:color .18s var(--ease);}
  nav a:hover, nav a.active{color:var(--ink);}


  /* Series tabs: a frosted bar centred in the header row, between the name and About.
     It is pulled up into the header (which is 12 + 24 + 20 = 56px tall) and sticks at
     the same height while the grid scrolls under it; the 30px bar is centred on the
     header's text line, and the grid still starts where the header ends.
     Tab text is 14px, like the grid's caption tags. */
  .tabs{
    position:sticky;top:9px;z-index:15;
    display:flex;justify-content:center;
    padding:0 var(--pad);margin:-47px 0 17px;
    pointer-events:none;flex:none;
  }
  .tabs[hidden]{display:none;}
  .tabs-inner{
    pointer-events:auto;
    display:flex;gap:2px;padding:2px;border-radius:9px;
    background:rgba(236,236,236,0.62);
    -webkit-backdrop-filter:blur(18px) saturate(1.6);backdrop-filter:blur(18px) saturate(1.6);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,0.35);
  }
  .tab{
    display:flex;align-items:center;gap:14px;
    padding:3px 10px;border-radius:7px;
    font-size:14px;line-height:20px;
    color:var(--ink);white-space:nowrap;
    transition:background-color .18s var(--ease);
  }
  .tab .n{color:#6b6b6b;font-variant-numeric:tabular-nums;}
  .tab:hover{background:rgba(255,255,255,0.45);}
  .tab.active{background:rgba(255,255,255,0.92);}
  .tab:focus{outline:none;}
  .tab:focus-visible{outline:2px solid var(--ink);outline-offset:1px;}

  main{flex:1 0 auto;}

  .view{opacity:0;transition:opacity .22s var(--ease);}
  .view.in{opacity:1;}

  /* Row-order masonry: layoutGrid() places each photo into the shortest of
     3 / 2 / 1 columns (>900px / >600px / phone) so the CMS order reads left to right. */
  .grid{
    position:relative;
    padding:0 var(--pad) 64px;
  }
  .grid figure{
    position:absolute;
    margin:0;
    overflow:hidden;
    border-radius:var(--radius);
    background:#f2f2f2;
    cursor:pointer;
  }
  .grid figure:focus{outline:none;}
  .grid figure:focus-visible{outline:2px solid var(--ink);outline-offset:2px;}
  .grid img{width:100%;height:auto;display:block;opacity:0;transition:opacity .3s var(--ease);}
  .grid img.loaded{opacity:1;}
  .grid figure:hover img.loaded{opacity:0.88;}
  /* Frosted caption tag, shown on hover (pointer devices) or keyboard focus */
  .grid .chip{
    position:absolute;left:10px;bottom:10px;right:10px;
    max-width:70%;width:max-content;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    background:rgba(255,255,255,0.6);color:var(--ink);
    -webkit-backdrop-filter:blur(14px) saturate(1.6);backdrop-filter:blur(14px) saturate(1.6);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,0.35);
    font-size:14px;line-height:20px;padding:5px 10px;border-radius:8px;
    opacity:0;transition:opacity .18s var(--ease);
    pointer-events:none;
  }
  @media(hover:hover){ .grid figure:hover .chip{opacity:1;} }
  .grid figure:focus-visible .chip{opacity:1;}

  .about{display:flex;gap:48px;align-items:flex-start;padding:4vh var(--pad) 12vh;}
  .about-text{flex:1;min-width:0;}
  .about-text p{max-width:587px;}
  .about-text p+p{margin-top:20px;}
  .about-photo{flex:1;min-width:0;height:auto;border-radius:var(--radius);background:#f2f2f2;display:block;}

  .status{padding:4vh var(--pad);color:var(--muted);}

  footer{
    flex:none;
    padding:24px var(--pad) 28px;
    display:flex;justify-content:space-between;align-items:center;gap:16px;
    color:var(--muted);
  }
  footer a{transition:color .18s var(--ease);}
  footer a:hover{color:var(--ink);}

  .lightbox{
    position:fixed;inset:0;background:var(--bg);z-index:200;
    display:flex;flex-direction:column;
    opacity:0;visibility:hidden;
    transition:opacity .22s var(--ease), visibility 0s linear .22s;
  }
  .lightbox.open{opacity:1;visibility:visible;transition:opacity .22s var(--ease), visibility 0s;}
  /* Fixed two-line height so a wrapping caption never moves or resizes the photo.
     Caption and Close sit in pills, matching the grid's caption tags. */
  .lightbox-bar{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:var(--pad);flex:none;height:calc(var(--pad) * 2 + 56px);}
  .lightbox-bar .cap{
    color:var(--muted);min-width:0;
    display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;overflow:hidden;
    background:#f2f2f2;border-radius:8px;padding:4px 12px;
  }
  .lightbox-bar .cap:empty{display:none;}
  .lightbox-bar .cap .lb-project{color:var(--ink);cursor:pointer;transition:opacity .18s var(--ease);}
  .lightbox-bar .cap .lb-project:hover{opacity:0.55;}
  .lightbox-bar .close{background:#f2f2f2;border:none;border-radius:8px;padding:4px 12px;cursor:pointer;color:var(--ink);flex:none;line-height:24px;transition:background .18s var(--ease);}
  .lightbox-bar .close:hover{background:#e6e6e6;}
  .lightbox-main{flex:1;min-height:0;display:flex;align-items:center;gap:4px;padding:0 var(--pad);overflow:hidden;touch-action:none;}
  .lightbox-main .navbtn{
    flex:none;background:#f2f2f2;border:none;border-radius:8px;cursor:pointer;color:var(--ink);padding:6px;
    display:flex;align-items:center;justify-content:center;
    transition:background .18s var(--ease);
  }
  .lightbox-main .navbtn:hover{background:#e6e6e6;}
  .lightbox-main .navbtn svg{width:18px;height:18px;}
  .stage{flex:1;min-width:0;height:100%;position:relative;transform-origin:0 0;}
  .stage img{
    position:absolute;inset:0;margin:auto;
    max-width:100%;max-height:100%;width:auto;height:auto;
    object-fit:contain;border-radius:var(--radius);
    opacity:0;transition:opacity .3s var(--ease);
  }
  .stage img.visible{opacity:1;}
  /* Tap the photo (touch) to fade the caption and filmstrip away; tap again to bring them back */
  .lightbox-bar,.filmstrip{transition:opacity .2s var(--ease), visibility 0s;}
  .lightbox.chrome-off .lightbox-bar,
  .lightbox.chrome-off .filmstrip{opacity:0;visibility:hidden;transition:opacity .2s var(--ease), visibility 0s linear .2s;}
  .stage-ph{position:absolute;inset:0;margin:auto;border-radius:var(--radius);background:#f2f2f2;opacity:0;transition:opacity .2s var(--ease);pointer-events:none;}
  .stage-ph.on{opacity:1;}

  /* Loading state: placeholders softly pulse between two greys until the photo arrives */
  @keyframes ph-pulse{0%,100%{background-color:#efefef}50%{background-color:#f8f8f8}}
  .pulsing{animation:ph-pulse 1.6s var(--ease) infinite;}
  .filmstrip{display:flex;justify-content:safe center;gap:var(--gap);overflow-x:auto;padding:12px var(--pad) 16px;flex:none;}
  .filmstrip img{
    width:56px;height:56px;object-fit:cover;border-radius:6px;background:#f2f2f2;
    cursor:pointer;flex:none;opacity:0.35;transition:opacity .18s var(--ease);
  }
  .filmstrip img.current{opacity:1;}
  .filmstrip img:hover{opacity:0.7;}

  @media(prefers-reduced-motion:reduce){
    *{transition:none !important;animation:none !important;}
    .view{opacity:1;}
  }
  /* Too narrow to share the header row with the name: the tabs get their own row below it */
  @media(max-width:720px){
    .tabs{top:var(--pad);margin:0 0 12px;}
  }
  @media(max-width:720px){
    .about{flex-direction:column;gap:0;}
    .about-text{flex:none;}
    .about-photo{order:-1;flex:none;width:100%;margin-bottom:28px;}
  }
  @media(max-width:600px){
    .lightbox-main{flex-direction:column;align-items:stretch;}
    .lightbox-main .navbtn{display:none;}
    /* Three tabs fit a phone once the counts are dropped */
    .tab{padding:3px 9px;}
    .tab .n{display:none;}
  }
</style>
</head>
<body>

<header>
  <div class="brand" id="brand"><a href="#/" class="logo">Dominic Lucaciu</a></div>
  <nav id="nav"><a href="#/about">About</a></nav>
</header>

<div class="tabs" id="tabs" hidden><nav class="tabs-inner" id="tabsInner" aria-label="Series"></nav></div>

<main id="app"></main>

<footer>
  <a href="mailto:lucaciu.dominic@gmail.com">Email</a>
  <a href="https://www.instagram.com/dominic_lucaciu/" target="_blank" rel="noopener">Instagram</a>
</footer>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer" aria-hidden="true">
  <div class="lightbox-bar">
    <span class="cap" id="lbCap"></span>
    <button class="close" id="lbClose">Close</button>
  </div>
  <div class="lightbox-main">
    <button class="navbtn" id="lbPrev" aria-label="Previous photo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div class="stage" id="stage">
      <div class="stage-ph" id="stagePh"></div>
      <img id="lbA" src="" alt="">
      <img id="lbB" src="" alt="">
    </div>
    <button class="navbtn" id="lbNext" aria-label="Next photo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
    </button>
  </div>
  <div class="filmstrip" id="filmstrip"></div>
</div>

<script>
const ABOUT = [
  "Dominic Lucaciu is a photographer based in London, working in street photography.",
  "A product designer by day, shooting on his own time."
];

let FOLDERS = {};
let ORDER = [];
let ABOUT_DATA = null;
let DIMS = {};

const app = document.getElementById('app');
const navEl = document.getElementById('nav');
// Keep Tab focus inside the open lightbox.
function trapFocus(e, root){
  const f = root.querySelectorAll('button, a[href], [tabindex]:not([tabindex="-1"])');
  if(!f.length) return;
  const first = f[0], last = f[f.length - 1];
  if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
  else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
}


async function loadContent(){
  const manifest = await fetch('content/series.json', { cache:'no-cache' }).then(r => r.json());
  const series = await Promise.all(
    manifest.map(name =>
      fetch(`content/series/${name}.json`, { cache:'no-cache' })
        .then(r => r.ok ? r.json() : null)
        .catch(() => null)
    )
  );
  const valid = series.filter(s => s && Array.isArray(s.photos) && s.photos.length);
  valid.sort((a,b) => (a.order ?? 99) - (b.order ?? 99));

  FOLDERS = {};
  ORDER = [];
  valid.forEach(s => {
    const key = s.slug;
    FOLDERS[key] = {
      title: s.title,
      photos: s.photos.map(p => ({ src: p.image, cap: p.caption || '', featured: !!p.featured }))
    };
    ORDER.push(key);
  });

  [ABOUT_DATA, DIMS] = await Promise.all([
    fetch('content/about.json', { cache:'no-cache' }).then(r => r.ok ? r.json() : null).catch(() => null),
    fetch('content/dims.json', { cache:'no-cache' }).then(r => r.ok ? r.json() : {}).catch(() => ({}))
  ]);
}

// Known shape of a photo (from content/dims.json, else this session's cache) so
// the layout can reserve its space before it downloads instead of jumping.
function ratioOf(src){
  const d = DIMS && DIMS[src];
  return d ? `${d[0]} / ${d[1]}` : (arCache[src] || '3 / 2');
}

// Row-order masonry. Each photo goes into the currently shortest column, left to
// right, so the CMS order reads across rows; heights come from the known aspect
// ratios, so placement is final before any photo downloads. DOM order is untouched.
const GRID_GAP = 8;
function parseRatio(s){
  const p = String(s || '').split('/');
  const r = p.length === 2 ? parseFloat(p[0]) / parseFloat(p[1]) : parseFloat(p[0]);
  return r > 0 ? r : 1.5;
}
function layoutGrid(grid){
  const figs = [...grid.children];
  if(!figs.length) return;
  const cols = innerWidth > 900 ? 3 : innerWidth > 600 ? 2 : 1;
  const cs = getComputedStyle(grid);
  const padL = parseFloat(cs.paddingLeft), padR = parseFloat(cs.paddingRight);
  // Remember the width this layout was computed for: placing the photos can make the
  // page tall enough to add a scrollbar, and the resize check must then see a change.
  const width = grid.clientWidth;
  const colW = (width - padL - padR - GRID_GAP * (cols - 1)) / cols;
  const heights = new Array(cols).fill(0);
  figs.forEach(fig => {
    const c = heights.indexOf(Math.min(...heights));
    fig.style.width = colW + 'px';
    fig.style.left = (padL + c * (colW + GRID_GAP)) + 'px';
    fig.style.top = heights[c] + 'px';
    heights[c] += colW / parseRatio(fig.style.aspectRatio) + GRID_GAP;
  });
  grid.style.height = (Math.max(...heights) - GRID_GAP + parseFloat(cs.paddingBottom)) + 'px';
  grid.dataset.w = width;
}
let layoutTimer = 0;
function scheduleLayout(){
  clearTimeout(layoutTimer);
  layoutTimer = setTimeout(() => {
    const g = app.querySelector('.grid');
    if(g) layoutGrid(g);
  }, 50);
}
function relayoutIfResized(){
  const g = app.querySelector('.grid');
  if(g && +g.dataset.w !== g.clientWidth) scheduleLayout();
}
new ResizeObserver(relayoutIfResized).observe(app);
window.addEventListener('resize', relayoutIfResized);
function sizeAttrs(src){
  const d = DIMS && DIMS[src];
  return d ? `width="${d[0]}" height="${d[1]}"` : '';
}

function buildNav(){
  // Series tabs: Selected (the featured wall) plus one tab per series, with counts.
  const tab = (route, label, n) =>
    `<a class="tab" href="${route}" data-route="${route}"><span>${esc(label)}</span><span class="n">${n}</span></a>`;
  document.getElementById('tabsInner').innerHTML =
    tab('#/', 'Selected', featuredPhotos().length)
    + ORDER.map(key => tab(`#/project/${key}`, FOLDERS[key].title, FOLDERS[key].photos.length)).join('');
}

function featuredPhotos(){
  const buckets = ORDER.map(key =>
    FOLDERS[key].photos
      .map((p, i) => ({ key, i, p }))
      .filter(x => x.p.featured)
  );
  const out = [];
  let round = 0, added = true;
  while(added){
    added = false;
    buckets.forEach(b => {
      if(b[round]){ out.push(b[round]); added = true; }
    });
    round++;
  }
  if(out.length) return out;
  return ORDER.flatMap(key => FOLDERS[key].photos.map((p, i) => ({ key, i, p })));
}

function esc(s){
  return (s || '').replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
}

// A lightbox sequence is an ordered list of { src, cap, key, title } —
// key/title identify the project each photo belongs to.
function homeSequence(){
  return featuredPhotos().map(({ key, p }) => ({ src: p.src, cap: p.cap, key, title: FOLDERS[key].title }));
}
function projectSequence(key){
  return FOLDERS[key].photos.map(p => ({ src: p.src, cap: p.cap, key, title: FOLDERS[key].title }));
}

// The first photo on a page is the likely LCP element — fetch it eagerly at high priority.
function loadAttrs(i){
  return i === 0 ? 'loading="eager" fetchpriority="high" decoding="async"' : 'loading="lazy" decoding="async"';
}

function homeView(){
  const items = featuredPhotos();
  return `
    <div class="grid">
      ${items.map(({key, p}, pos) => `
        <figure data-list="home" data-index="${pos}" style="aspect-ratio:${ratioOf(p.src)}">
          <img src="${p.src}" alt="${esc(p.cap)}" ${sizeAttrs(p.src)} ${loadAttrs(pos)}>
          <span class="chip">${esc(p.cap || FOLDERS[key].title)}</span>
        </figure>`).join('')}
    </div>`;
}

function folderView(key){
  const f = FOLDERS[key];
  if(!f){ return `<div class="status">Series not found</div>`; }
  return `
    <div class="grid">
      ${f.photos.map((p, i) => `
        <figure data-list="project" data-key="${key}" data-index="${i}" style="aspect-ratio:${ratioOf(p.src)}">
          <img src="${p.src}" alt="${esc(p.cap)}" ${sizeAttrs(p.src)} ${loadAttrs(i)}>
          ${p.cap ? `<span class="chip">${esc(p.cap)}</span>` : ''}
        </figure>`).join('')}
    </div>`;
}

function aboutView(){
  const data = ABOUT_DATA || {};
  const paras = data.bio
    ? data.bio.split(/\n{2,}/).map(s => s.trim()).filter(Boolean)
    : ABOUT;
  const photo = data.image
    ? `<img class="about-photo" src="${data.image}" alt="Dominic Lucaciu" ${sizeAttrs(data.image)} style="aspect-ratio:${ratioOf(data.image)}" fetchpriority="high" decoding="async">`
    : '';
  return `
    <div class="about">
      <div class="about-text">
        ${paras.map(p => `<p>${esc(p)}</p>`).join('')}
      </div>
      ${photo}
    </div>`;
}

function attachGridHandlers(){
  document.querySelectorAll('.grid figure').forEach(fig => {
    const img = fig.querySelector('img');
    fig.setAttribute('role', 'button');
    fig.setAttribute('tabindex', '0');
    fig.setAttribute('aria-label', img && img.alt ? `Open photo: ${img.alt}` : 'Open photo');
    const open = () => {
      const index = parseInt(fig.dataset.index, 10);
      const list = fig.dataset.list === 'home' ? homeSequence() : projectSequence(fig.dataset.key);
      lbReturnFocus = fig;
      openLightbox(list, index);
    };
    fig.addEventListener('click', open);
    fig.addEventListener('keydown', e => {
      if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); open(); }
    });
  });
}

// Cache each photo's aspect ratio (by src) for the session so the masonry
// reserves the right space on re-render/navigation and doesn't reflow.
let arCache = {};
try { arCache = JSON.parse(sessionStorage.getItem('dl-ar') || '{}'); } catch(e){}

// Pulse a placeholder (the image itself, or its container) until the image has loaded.
function pulseUntilLoaded(img, el = img){
  if(img.complete && img.naturalWidth) return;
  el.classList.add('pulsing');
  const stop = () => el.classList.remove('pulsing');
  img.addEventListener('load', stop, { once: true });
  img.addEventListener('error', stop, { once: true });
}

function attachImageFades(){
  const about = document.querySelector('.about-photo');
  if(about) pulseUntilLoaded(about);
  document.querySelectorAll('.grid figure').forEach(fig => {
    const img = fig.querySelector('img');
    if(!img) return;
    pulseUntilLoaded(img, fig);
    const key = img.getAttribute('src');
    if(arCache[key]) fig.style.aspectRatio = arCache[key];
    const reveal = () => {
      img.classList.add('loaded');
      if(img.naturalWidth && img.naturalHeight){
        const ar = (img.naturalWidth / img.naturalHeight).toFixed(4);
        const assumed = parseRatio(fig.style.aspectRatio);
        fig.style.aspectRatio = ar;
        if(Math.abs(assumed - ar) > 0.01) scheduleLayout(); // shape wasn't known in advance
        if(arCache[key] !== ar){
          arCache[key] = ar;
          try { sessionStorage.setItem('dl-ar', JSON.stringify(arCache)); } catch(e){}
        }
      }
    };
    if(img.complete && img.naturalWidth){ reveal(); return; }
    img.addEventListener('load', reveal, { once:true });
    img.addEventListener('error', () => img.classList.add('loaded'), { once:true });
  });
}

let firstRender = true;
function render(){
  const hash = location.hash || '#/';
  const projectMatch = hash.match(/^#\/project\/([a-z0-9-]+)/);
  const series = projectMatch && FOLDERS[projectMatch[1]];
  document.title = series ? `${series.title} — Dominic Lucaciu`
    : hash === '#/about' ? 'About — Dominic Lucaciu' : 'Dominic Lucaciu — Photography';
  navEl.querySelector('a[href="#/about"]').classList.toggle('active', hash === '#/about');

  let html;
  if(projectMatch){
    html = folderView(projectMatch[1]);
  } else if(hash === '#/about'){
    html = aboutView();
  } else {
    html = homeView();
  }

  // Tabs show on the photo walls (home + each series), not on About.
  const tabsEl = document.getElementById('tabs');
  const tabRoute = projectMatch ? (FOLDERS[projectMatch[1]] ? hash : null) : (hash === '#/about' ? null : '#/');
  tabsEl.hidden = !tabRoute;
  tabsEl.querySelectorAll('.tab').forEach(a => {
    const on = a.dataset.route === tabRoute;
    a.classList.toggle('active', on);
    on ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current');
  });

  const paint = () => {
    app.innerHTML = `<div class="view">${html}</div>`;
    attachGridHandlers();
    attachImageFades();
    const grid = app.querySelector('.grid');
    if(grid) layoutGrid(grid);
    window.scrollTo(0,0);
    requestAnimationFrame(() => {
      const v = app.querySelector('.view');
      if(v) v.classList.add('in');
    });
  };

  const existing = app.querySelector('.view');
  if(existing && !firstRender){
    existing.classList.remove('in');
    setTimeout(paint, 160);
  } else {
    paint();
  }
  firstRender = false;
}

/* ---- Lightbox ---- */
const lb = document.getElementById('lightbox');
const layers = [document.getElementById('lbA'), document.getElementById('lbB')];
const lbCap = document.getElementById('lbCap');
const filmstrip = document.getElementById('filmstrip');
const stagePh = document.getElementById('stagePh');
let activeLayer = 0, lbList = [], currentIndex = 0, token = 0, lbReturnFocus = null;

// On first open the stage is empty until the photo downloads; show a pulsing
// placeholder in the photo's contain-fit shape (skipped if it's already cached).
function showStagePlaceholder(src){
  const probe = new Image(); probe.src = src;
  if(probe.complete) return;
  const d = (DIMS && DIMS[src]) || [3, 2];
  const W = stageEl.clientWidth, H = stageEl.clientHeight;
  if(!W || !H) return;
  const s = Math.min(W / d[0], H / d[1]);
  stagePh.style.width = Math.round(d[0] * s) + 'px';
  stagePh.style.height = Math.round(d[1] * s) + 'px';
  stagePh.classList.add('on', 'pulsing');
}
function hideStagePlaceholder(){ stagePh.classList.remove('on', 'pulsing'); }

function preload(src){
  return new Promise(resolve => {
    const img = new Image();
    img.onload = img.onerror = () => resolve();
    img.src = src;
  });
}

async function showPhoto(index, immediate){
  resetZoom();
  const p = lbList[index];
  const myToken = ++token;
  await preload(p.src);
  if(myToken !== token) return;

  const incoming = layers[1 - activeLayer];
  const outgoing = layers[activeLayer];
  incoming.src = p.src;
  incoming.alt = p.cap;

  const swap = () => { incoming.classList.add('visible'); outgoing.classList.remove('visible'); };
  immediate ? swap() : requestAnimationFrame(swap);
  hideStagePlaceholder();

  activeLayer = 1 - activeLayer;
  currentIndex = index;
  lbCap.innerHTML = `<a class="lb-project" href="#/project/${p.key}">${esc(p.title)}</a>${p.cap ? ` — ${esc(p.cap)}` : ''}`;
  filmstrip.querySelectorAll('img').forEach((img, i) => img.classList.toggle('current', i === index));
  const thumb = filmstrip.children[index];
  if(thumb) thumb.scrollIntoView({ block: 'nearest', inline: 'center' });

  const n = lbList.length;
  preload(lbList[(index + 1) % n].src);
  preload(lbList[(index - 1 + n) % n].src);
}

function openLightbox(list, index){
  lbList = list;
  renderFilmstrip(index);
  layers.forEach(l => { l.classList.remove('visible'); l.src = ''; });
  activeLayer = 0;
  showStagePlaceholder(list[index].src);
  showPhoto(index, true);
  lb.classList.add('open');
  lb.setAttribute('aria-hidden', 'false');
  document.body.style.overflow = 'hidden';
  document.getElementById('lbClose').focus();
}
function closeLightbox(){
  resetZoom();
  hideStagePlaceholder();
  clearTimeout(tapTimer);
  lb.classList.remove('chrome-off');
  lb.classList.remove('open');
  lb.setAttribute('aria-hidden', 'true');
  document.body.style.overflow = '';
  if(lbReturnFocus){ lbReturnFocus.focus(); lbReturnFocus = null; }
}
function renderFilmstrip(index){
  filmstrip.innerHTML = lbList.map((p, i) => `<img src="${p.src}" alt="${esc(p.cap)}" data-index="${i}" class="${i===index?'current':''}" loading="lazy" decoding="async">`).join('');
  filmstrip.querySelectorAll('img').forEach(thumb => {
    pulseUntilLoaded(thumb);
    thumb.addEventListener('click', () => showPhoto(parseInt(thumb.dataset.index, 10)));
  });
}
function nextPhoto(){ showPhoto((currentIndex + 1) % lbList.length); }
function prevPhoto(){ const n = lbList.length; showPhoto((currentIndex - 1 + n) % n); }

// A project link inside the caption closes the lightbox; its href handles navigation.
lbCap.addEventListener('click', e => { if(e.target.closest('.lb-project')) closeLightbox(); });
document.getElementById('lbClose').addEventListener('click', closeLightbox);
document.getElementById('lbNext').addEventListener('click', nextPhoto);
document.getElementById('lbPrev').addEventListener('click', prevPhoto);
document.addEventListener('keydown', e => {
  if(!lb.classList.contains('open')) return;
  if(e.key === 'Escape') closeLightbox();
  else if(e.key === 'ArrowRight') nextPhoto();
  else if(e.key === 'ArrowLeft') prevPhoto();
  else if(e.key === 'Tab') trapFocus(e, lb);
});

/* ---- Touch: swipe to change photo (when not zoomed); pinch & double-tap to zoom ---- */
const lbMain = document.querySelector('.lightbox-main');
const stageEl = document.getElementById('stage');
let zScale = 1, zTx = 0, zTy = 0, lastTap = 0, gesture = null, tapTimer = 0;

function resetZoom(){
  zScale = 1; zTx = 0; zTy = 0;
  stageEl.style.transition = '';
  stageEl.style.transform = '';
}
function applyZoom(){
  stageEl.style.transform = (zScale === 1 && !zTx && !zTy)
    ? '' : `translate(${zTx}px, ${zTy}px) scale(${zScale})`;
}
function zoomed(){ return zScale > 1.01; }
function touchDist(a, b){ return Math.hypot(b.clientX - a.clientX, b.clientY - a.clientY); }

// Rendered (contain-fit) size of the current photo inside the stage box.
function stageBox(){
  const W = stageEl.clientWidth, H = stageEl.clientHeight;
  const img = stageEl.querySelector('img.visible') || stageEl.querySelector('img');
  let iw = W, ih = H;
  if(img && img.naturalWidth && img.naturalHeight){
    const arI = img.naturalWidth / img.naturalHeight, arS = W / H;
    if(arI > arS){ iw = W; ih = W / arI; } else { ih = H; iw = H * arI; }
  }
  return { W, H, iw, ih, ox: (W - iw) / 2, oy: (H - ih) / 2 };
}
// Keep the photo covering the viewport where it can, otherwise centre it.
function clampTranslate(){
  const m = stageBox();
  zTx = (m.iw * zScale >= m.W)
    ? Math.min(-m.ox * zScale, Math.max(m.W - (m.ox + m.iw) * zScale, zTx))
    : m.W / 2 - (m.ox + m.iw / 2) * zScale;
  zTy = (m.ih * zScale >= m.H)
    ? Math.min(-m.oy * zScale, Math.max(m.H - (m.oy + m.ih) * zScale, zTy))
    : m.H / 2 - (m.oy + m.ih / 2) * zScale;
}
function doubleTapZoom(cx, cy){
  stageEl.style.transition = 'transform .2s var(--ease)';
  if(zoomed()){ zScale = 1; zTx = 0; zTy = 0; }
  else {
    const r = stageEl.getBoundingClientRect();
    const Lx = r.left - zTx, Ly = r.top - zTy;
    const lx = (cx - r.left) / zScale, ly = (cy - r.top) / zScale;
    zScale = 2.5;
    zTx = cx - Lx - lx * zScale;
    zTy = cy - Ly - ly * zScale;
    clampTranslate();
  }
  applyZoom();
}

lbMain.addEventListener('touchstart', e => {
  stageEl.style.transition = '';
  if(e.touches.length === 2){
    const [a, b] = e.touches;
    const r = stageEl.getBoundingClientRect();
    const mx = (a.clientX + b.clientX) / 2, my = (a.clientY + b.clientY) / 2;
    gesture = { mode: 'pinch', startDist: touchDist(a, b), startScale: zScale,
      Lx: r.left - zTx, Ly: r.top - zTy, lx: (mx - r.left) / zScale, ly: (my - r.top) / zScale };
  } else if(e.touches.length === 1){
    const t = e.touches[0], now = Date.now();
    if(now - lastTap < 300){
      clearTimeout(tapTimer); // it's a double-tap (zoom), not a single tap
      lastTap = 0; e.preventDefault();
      doubleTapZoom(t.clientX, t.clientY);
      gesture = { mode: 'tapped' };
    } else {
      lastTap = now;
      gesture = zoomed()
        ? { mode: 'pan', x: t.clientX, y: t.clientY, tx: zTx, ty: zTy }
        : { mode: 'swipe', x: t.clientX, y: t.clientY };
    }
  }
}, { passive: false });

lbMain.addEventListener('touchmove', e => {
  if(!gesture) return;
  if(gesture.mode === 'pinch' && e.touches.length === 2){
    e.preventDefault();
    const [a, b] = e.touches;
    zScale = Math.min(4, Math.max(1, gesture.startScale * (touchDist(a, b) / gesture.startDist)));
    const mx = (a.clientX + b.clientX) / 2, my = (a.clientY + b.clientY) / 2;
    zTx = mx - gesture.Lx - gesture.lx * zScale;
    zTy = my - gesture.Ly - gesture.ly * zScale;
    clampTranslate();
    applyZoom();
  } else if(gesture.mode === 'pan' && e.touches.length === 1){
    e.preventDefault();
    const t = e.touches[0];
    zTx = gesture.tx + (t.clientX - gesture.x);
    zTy = gesture.ty + (t.clientY - gesture.y);
    clampTranslate();
    applyZoom();
  }
}, { passive: false });

lbMain.addEventListener('touchend', e => {
  if(gesture && gesture.mode === 'swipe' && e.changedTouches.length){
    const t = e.changedTouches[0];
    const dx = t.clientX - gesture.x, dy = t.clientY - gesture.y;
    if(!zoomed() && Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy) * 1.4){ dx < 0 ? nextPhoto() : prevPhoto(); }
    else if(Math.abs(dx) < 10 && Math.abs(dy) < 10){
      // A single tap: wait out the double-tap window, then toggle the caption/filmstrip.
      clearTimeout(tapTimer);
      tapTimer = setTimeout(() => lb.classList.toggle('chrome-off'), 300);
    }
  }
  if(gesture && gesture.mode === 'pinch' && !zoomed()){
    stageEl.style.transition = 'transform .2s var(--ease)';
    zScale = 1; zTx = 0; zTy = 0; applyZoom();
  }
  if(e.touches.length === 0){ gesture = null; }
  else if(e.touches.length === 1 && zoomed()){
    const t = e.touches[0];
    gesture = { mode: 'pan', x: t.clientX, y: t.clientY, tx: zTx, ty: zTy };
  }
}, { passive: false });

/* ---- boot ---- */
loadContent()
  .then(() => {
    buildNav();
    window.addEventListener('hashchange', render);
    render();
  })
  .catch(() => {
    app.innerHTML = `<div class="status">Couldn't load the photo series. If you're opening this file directly, run a local server instead: <code>npx serve</code></div>`;
  });
</script>
