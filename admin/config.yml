backend:
  name: github
  repo: DominicSergiu/photography-site
  branch: main

media_folder: images
public_folder: /images

collections:
  - name: series
    label: Series
    label_singular: Series
    folder: content/series
    create: true
    delete: true
    extension: json
    format: json
    identifier_field: title
    summary: "{{title}}"
    fields:
      - name: title
        label: Series name
        widget: string
      - name: slug
        label: URL slug
        widget: string
      - name: order
        label: Order in navigation
        widget: number
        value_type: int
        default: 1
      - name: photos
        label: Photos
        label_singular: Photo
        widget: list
        fields:
          - name: image
            label: Photo
            widget: image
          - name: caption
            label: Caption
            widget: string
            required: false
          - name: featured
            label: Show on homepage
            widget: boolean
            default: false
