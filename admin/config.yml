backend:
  name: github
  repo: YOUR-GITHUB-USERNAME/YOUR-REPO-NAME
  branch: main

media_folder: images
public_folder: images

collections:
  - name: series
    label: Series
    label_singular: Series
    folder: content/series
    create: true
    delete: true
    extension: json
    format: json
    identifier_field: title
    summary: "{{title}}"
    sortable_fields: [order, title]
    fields:
      - name: title
        label: Series name
        widget: string
        hint: Shown in the navigation, e.g. Street

      - name: slug
        label: URL slug
        widget: string
        pattern: ['^[a-z0-9-]+$', 'Lowercase letters, numbers and hyphens only']
        hint: Used in the address bar, e.g. street

      - name: order
        label: Order in navigation
        widget: number
        value_type: int
        default: 1

      - name: photos
        label: Photos
        label_singular: Photo
        widget: list
        summary: "{{fields.caption}}"
        fields:
          - name: image
            label: Photo
            widget: image
            media_library:
              config:
                max_file_size: 8000000

          - name: caption
            label: Caption
            widget: string
            required: false

          - name: featured
            label: Show on homepage
            widget: boolean
            default: false
